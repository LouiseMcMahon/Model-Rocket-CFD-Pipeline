# Compressible smoke test: coarse mesh, Mach 0.3 / 0.8 / 1.2 at zero angle of attack.
model: ../models/test_rocket.stl
name: test_rocket_compressible
regime: compressible

mesh:
  preset: coarse

solver:
  iterations: 1500
  average_last: 200
  nprocs: 8

sweeps:
  speed:
    aoa: 0
    speeds: [100, 272, 408]
  aoa: null

output_dir: ../runs
